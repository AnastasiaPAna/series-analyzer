<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(content)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Series Analyzer Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<nav class="navbar navbar-expand-lg app-navbar sticky-top">
    <div class="container py-2">
        <a class="navbar-brand fw-semibold" href="/" th:href="@{/}" data-view-link="home">
            Series Analyzer
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNav"
                aria-controls="mainNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <div class="navbar-nav ms-auto gap-lg-2">
                <a class="nav-link" href="/" th:href="@{/?view=home}" data-view-link="home" data-i18n="nav.dashboard">Dashboard</a>
                <a class="nav-link" href="/series" th:href="@{/series}" data-view-link="series" data-i18n="nav.series">Series</a>
                <a class="nav-link" href="/top" th:href="@{/top}" data-view-link="top" data-i18n="nav.top">Top 5</a>
                <a class="nav-link" href="/statistics" th:href="@{/statistics}" data-view-link="statistics" data-i18n="nav.statistics">Statistics</a>
            </div>
            <div class="language-switcher ms-lg-3 mt-3 mt-lg-0">
                <button id="lang-uk" type="button" class="btn btn-sm btn-language" data-language="uk">UA</button>
                <button id="lang-en" type="button" class="btn btn-sm btn-language" data-language="en">EN</button>
            </div>
            <label class="navbar-dev-toggle ms-lg-3 mt-3 mt-lg-0" title="Developer mode">
                <input id="developer-mode-toggle" type="checkbox">
                <span>Dev</span>
            </label>
        </div>
    </div>
</nav>

<div class="container py-4 py-lg-5">
    <div th:replace="${content}"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>

</body>
</html>
