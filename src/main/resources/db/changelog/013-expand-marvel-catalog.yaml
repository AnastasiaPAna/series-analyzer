        - insert:
            tableName: series
            columns:
              - column: { name: title, value: "Hawkeye" }
              - column: { name: genre, value: "Marvel Universe, Adventure, Comedy" }
              - column: { name: seasons, valueNumeric: 1 }
              - column: { name: rating, valueNumeric: 7.5 }
              - column: { name: year, valueNumeric: 2021 }
              - column: { name: finished, valueBoolean: true }
              - column: { name: studio_id, valueNumeric: 7 }
