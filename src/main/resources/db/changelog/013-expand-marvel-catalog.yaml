databaseChangeLog:
  - changeSet:
      id: 013-expand-marvel-catalog
      author: series
      context: seed
      changes:
        - insert:
            tableName: series
            columns:
              - column: { name: title, value: "Jessica Jones" }
              - column: { name: genre, value: "Marvel Universe, Crime, Thriller" }
              - column: { name: seasons, valueNumeric: 3 }
