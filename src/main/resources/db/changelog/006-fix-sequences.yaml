databaseChangeLog:
  - changeSet:
      id: 006-fix-postgres-sequences
      author: codex
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - sql:
            sql: |
              SELECT setval(
                pg_get_serial_sequence('studios', 'id'),
                COALESCE((SELECT MAX(id) FROM studios), 0) + 1,
                false
              );

              SELECT setval(
                pg_get_serial_sequence('series', 'id'),
                COALESCE((SELECT MAX(id) FROM series), 0) + 1,
                false
              );
