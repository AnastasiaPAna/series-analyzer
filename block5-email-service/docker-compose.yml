services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: block5-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: block5-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - block5_elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: block5-kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"

  mailpit:
    image: axllent/mailpit:v1.20
    container_name: block5-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  email-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: block5-email-service
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      mailpit:
        condition: service_started
    env_file:
      - ../.env
    environment:
      APP_PORT: 3020
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      ELASTICSEARCH_URI: http://elasticsearch:9200
      EMAIL_SMTP_HOST: mailpit
      EMAIL_SMTP_PORT: 1025
      EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_SMTP_AUTH: ${EMAIL_SMTP_AUTH:-false}
      EMAIL_SMTP_STARTTLS: ${EMAIL_SMTP_STARTTLS:-false}
      EMAIL_SMTP_FROM: ${EMAIL_SMTP_FROM:-no-reply@series.local}
      EMAIL_NOTIFICATION_QUEUE: ${EMAIL_NOTIFICATION_QUEUE:-series-email.notifications}
      EMAIL_NOTIFICATION_EXCHANGE: ${EMAIL_NOTIFICATION_EXCHANGE:-series.notifications}
      EMAIL_NOTIFICATION_ROUTING_KEY: ${EMAIL_NOTIFICATION_ROUTING_KEY:-email.notification}
      EMAIL_RETRY_DELAY_MS: ${EMAIL_RETRY_DELAY_MS:-300000}
    ports:
      - "3020:3020"

volumes:
  block5_elasticsearch_data:
